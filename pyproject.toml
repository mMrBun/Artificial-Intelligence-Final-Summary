[project]
name = "rag-knowledge-base"
version = "0.1.0"
description = "Local document RAG demo with FastAPI, Gradio, MinerU, Qwen and Chroma"
requires-python = ">=3.12,<3.13"
dependencies = [
 "mineru[torch]>=4.1,<5",
 "sentence-transformers>=5,<6",
 "chromadb>=1,<2",
 "fastapi>=0.115",
 "gradio>=6,<7",
 "uvicorn[standard]>=0.34",
 "pydantic-settings>=2",
 "openai>=2",
 "modelscope>=1",
 "beautifulsoup4>=4",
]
[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.11",
    "reportlab>=5.1.0",
    "python-docx>=1.2.0",
]
[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
